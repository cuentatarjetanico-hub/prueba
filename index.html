<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Menú Virtual</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; text-align: center; overflow-x: hidden; }
        /* Añadimos cursor pointer para que sepa que las fotos se pueden tocar */
        img { width: 100%; max-width: 600px; display: block; height: auto; margin: 0 auto; cursor: pointer; }
        
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-family: sans-serif;
            font-size: 22px; z-index: 9999; cursor: pointer;
        }
        .subtexto { font-size: 14px; color: #888; margin-top: 12px; }
    </style>
</head>
<body>

    <div id="pantalla-inicio" onclick="abrirMenuSinChrome()">
        <div>🍸TOCÁ PARA VER LA CARTA🍸</div>
        <div class="subtexto">(Abre la carta a pantalla completa)</div>
    </div>

    <!-- Ahora, al hacer clic en cualquier foto, vuelve a pantalla completa si se había salido -->
    <div onclick="abrirMenuSinChrome()">
        <img src="menu1.jpg" alt="Parte 1">
        <!-- Si tienes más imágenes (menu2.jpg, menu3.jpg), agrégalas aquí adentro -->
    </div>

    <script>
        function abrirMenuSinChrome() {
            var elemento = document.documentElement;
            if (elemento.requestFullscreen) elemento.requestFullscreen();
            else if (elemento.webkitRequestFullscreen) elemento.webkitRequestFullscreen();
            else if (elemento.mozRequestFullScreen) elemento.mozRequestFullScreen();
            else if (elemento.msRequestFullscreen) elemento.msRequestFullscreen();
            
            document.getElementById('pantalla-inicio').style.display = 'none';
        }
    </script>
</body>
</html>
